[project]
name = "instox"
version = "0.1.0"
description = "Smart billing and inventory for small shops"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nivedya M S" }]
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-login>=0.6.3",
    "flask-cors>=4.0.0",
    "werkzeug>=3.0.1",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

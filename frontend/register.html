<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · Instox</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container" style="max-width: 420px; margin-top: 40px;">
    <h1 style="text-align: center; color: var(--primary);">Instox</h1>
    <p style="text-align: center; color: var(--muted); margin-bottom: 24px;">Create your shop account</p>

    <div class="card">
      <h2>Sign up</h2>
      <div id="alert"></div>
      <form id="register-form">
        <div class="form-group">
          <label>Shop name</label>
          <input type="text" name="shop_name" class="form-control" placeholder="e.g. Ramesh Textiles" />
        </div>
        <div class="form-group">
          <label>Your name (username)</label>
          <input type="text" name="username" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Password (min 6 characters)</label>
          <input type="password" name="password" class="form-control" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-block">Create account</button>
      </form>
      <p style="text-align: center; margin-top: 16px; color: var(--muted);">
        Already have an account? <a href="/login.html">Login</a>
      </p>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await Instox.api('/auth/register', {
          method: 'POST',
          body: {
            shop_name: fd.get('shop_name'),
            username: fd.get('username'),
            email: fd.get('email'),
            password: fd.get('password'),
          },
        });
        location.href = '/';
      } catch (err) {
        Instox.showAlert('alert', err.message, 'error');
      }
    });
  </script>
</body>
</html>

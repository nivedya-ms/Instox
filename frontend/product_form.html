<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product · Instox</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav id="navbar" class="navbar"></nav>
  <div class="container" style="max-width: 560px;">
    <h1 id="page-title">Add product</h1>
    <div class="card">
      <div id="alert"></div>
      <form id="product-form">
        <div class="form-group">
          <label>Product name *</label>
          <input type="text" name="name" class="form-control" required placeholder="e.g. Blue Curtain 6x8" />
        </div>
        <div class="row">
          <div class="col form-group">
            <label>Cost price (₹) *</label>
            <input type="number" step="0.01" min="0" name="cost_price" class="form-control" required />
          </div>
          <div class="col form-group">
            <label>Set size</label>
            <input type="number" step="1" min="1" name="set_size" class="form-control" value="1" />
          </div>
        </div>
        <div class="row">
          <div class="col form-group">
            <label>Profit % (your markup)</label>
            <input type="number" step="0.01" min="0" name="profit_percentage" class="form-control" />
            <div style="font-size:0.75rem;color:var(--muted);margin-top:4px">Leave blank to use your default.</div>
          </div>
          <div class="col form-group">
            <label>Retail price (₹)</label>
            <input type="number" step="0.01" min="0" name="retail_price" class="form-control" />
            <div style="font-size:0.75rem;color:var(--muted);margin-top:4px">Auto-calculated. Override if needed.</div>
          </div>
        </div>
        <div class="row">
          <div class="col form-group">
            <label>Quantity in stock * <span id="unit-hint" style="color:var(--muted);font-weight:400"></span></label>
            <input type="number" step="1" min="0" name="quantity" class="form-control" required value="0" />
          </div>
          <div class="col form-group">
            <label>Category</label>
            <select name="category_id" id="category-select" class="form-control">
              <option value="">— None —</option>
            </select>
            <div id="category-hint" style="font-size:0.75rem;color:var(--muted);margin-top:4px"></div>
          </div>
        </div>
        <div class="form-group">
          <label>SKU (optional)</label>
          <input type="text" name="sku" class="form-control" />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" class="form-control" rows="2"></textarea>
        </div>

        <div class="form-group">
          <label>Photo</label>
          <div id="photo-block">
            <img id="photo-preview" class="photo-preview" style="display:none" alt="Preview" />
            <div class="photo-actions">
              <label for="photo-input" class="btn btn-sm btn-secondary" style="cursor:pointer">📷 Take / choose photo</label>
              <button type="button" id="remove-photo" class="btn btn-sm btn-danger" style="display:none">Remove</button>
            </div>
            <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" />
            <div id="photo-status" style="font-size:0.75rem;color:var(--muted);margin-top:6px"></div>
          </div>
        </div>

        <button type="submit" class="btn btn-block" id="submit-btn">Save</button>
        <a href="/products.html" class="btn btn-block btn-secondary" style="margin-top:8px">Cancel</a>
      </form>
    </div>

    <div class="card" style="margin-top:12px">
      <h3 style="margin-top:0">Add new category</h3>
      <div class="row">
        <input type="text" id="new-cat" class="form-control" placeholder="Category name" />
        <button id="add-cat-btn" class="btn btn-sm btn-secondary">Add</button>
      </div>
    </div>
  </div>
  <nav id="bottom-nav" class="bottom-nav"></nav>
  <script src="/static/js/app.js"></script>
  <script>
    (async () => {
      const user = await Instox.bootstrapPage({ active: 'products' });
      if (!user) return;

      const form = document.getElementById('product-form');
      const params = new URLSearchParams(location.search);
      const editingId = params.get('id');
      let editingProduct = null;

      const profitInput = form.profit_percentage;
      profitInput.placeholder = `Default ${user.profit_percentage}%`;

      const catSelect = document.getElementById('category-select');
      const unitHintEl = document.getElementById('unit-hint');
      const catHintEl = document.getElementById('category-hint');
      let categoriesById = {};

      function applyUnitHint() {
        const cat = categoriesById[catSelect.value];
        if (cat) {
          const label = cat.unit || 'pieces';
          unitHintEl.textContent = `(in ${label})`;
          catHintEl.textContent = `${cat.icon || '📦'} ${cat.name} — measured in ${label}`;
          form.quantity.step = '1';
        } else {
          unitHintEl.textContent = '';
          catHintEl.textContent = '';
          form.quantity.step = '1';
        }
      }

      async function loadCategories(selectedId) {
        const { data } = await Instox.api('/categories');
        categoriesById = Object.fromEntries(data.map((c) => [String(c.id), c]));
        catSelect.innerHTML = '<option value="">— None —</option>' +
          data.map((c) => `<option value="${c.id}" ${selectedId == c.id ? 'selected' : ''}>${Instox.escapeHtml(c.icon || '📦')} ${Instox.escapeHtml(c.name)}</option>`).join('');
        applyUnitHint();
      }
      catSelect.addEventListener('change', applyUnitHint);
      await loadCategories(null);

      const photoInput = document.getElementById('photo-input');
      const photoPreview = document.getElementById('photo-preview');
      const removePhotoBtn = document.getElementById('remove-photo');
      const photoStatus = document.getElementById('photo-status');
      let selectedPhotoFile = null;
      let existingPhotoUrl = null;

      function showPreview(src) {
        if (!src) {
          photoPreview.style.display = 'none';
          removePhotoBtn.style.display = 'none';
          return;
        }
        photoPreview.src = src;
        photoPreview.style.display = 'block';
        removePhotoBtn.style.display = 'inline-block';
      }

      photoInput.addEventListener('change', () => {
        const f = photoInput.files && photoInput.files[0];
        if (!f) return;
        if (f.size > 8 * 1024 * 1024) {
          Instox.toast('Photo too large (max 8 MB)', 'error');
          photoInput.value = '';
          return;
        }
        selectedPhotoFile = f;
        showPreview(URL.createObjectURL(f));
        photoStatus.textContent = `Selected: ${f.name} · will upload after save`;
      });

      removePhotoBtn.addEventListener('click', async () => {
        if (selectedPhotoFile) {
          selectedPhotoFile = null;
          photoInput.value = '';
          if (existingPhotoUrl) {
            showPreview(existingPhotoUrl);
            photoStatus.textContent = 'Kept current photo.';
          } else {
            showPreview(null);
            photoStatus.textContent = '';
          }
          return;
        }
        if (editingId && existingPhotoUrl) {
          if (!confirm('Remove current photo?')) return;
          try {
            const { data } = await Instox.api('/products/' + editingId + '/photo', { method: 'DELETE' });
            existingPhotoUrl = data.photo_url || null;
            showPreview(null);
            photoStatus.textContent = 'Photo removed.';
            Instox.toast('Photo removed', 'success');
          } catch (err) {
            Instox.toast(err.message, 'error');
          }
        }
      });

      if (editingId) {
        document.getElementById('page-title').textContent = 'Edit product';
        try {
          const { data } = await Instox.api('/products/' + editingId);
          editingProduct = data;
          form.name.value = data.name;
          form.cost_price.value = data.cost_price;
          form.retail_price.value = data.retail_price;
          form.quantity.value = data.quantity;
          form.sku.value = data.sku || '';
          form.description.value = data.description || '';
          if (data.category_id) { form.category_id.value = data.category_id; applyUnitHint(); }
          if (data.photo_url) {
            existingPhotoUrl = data.photo_url;
            showPreview(data.photo_url);
          }
          if (data.unique_id) {
            document.getElementById('page-title').innerHTML = `Edit product <span style="font-family:monospace;font-size:0.7em;color:var(--muted)">${Instox.escapeHtml(data.unique_id)}</span>`;
          }
        } catch (e) {
          Instox.showAlert('alert', e.message, 'error');
        }
      }

      let lastCalcedCost = null;

      async function recalcRetail() {
        const cost = parseFloat(form.cost_price.value);
        const setSize = parseInt(form.set_size.value || '1', 10) || 1;
        if (!cost || cost <= 0) return;
        try {
          const body = { cost_price: cost, set_size: setSize };
          if (form.profit_percentage.value) body.profit_percentage = parseFloat(form.profit_percentage.value);
          const { data } = await Instox.api('/products/calculate-price', { method: 'POST', body });
          form.retail_price.value = data.retail_price;
          lastCalcedCost = cost;
        } catch (e) { /* ignore */ }
      }

      ['cost_price', 'set_size', 'profit_percentage'].forEach((n) => {
        form[n].addEventListener('input', Instox.debounce(recalcRetail, 200));
      });

      document.getElementById('add-cat-btn').addEventListener('click', async () => {
        const name = document.getElementById('new-cat').value.trim();
        if (!name) return;
        try {
          const { data } = await Instox.api('/categories', { method: 'POST', body: { name } });
          document.getElementById('new-cat').value = '';
          await loadCategories(data.id);
          Instox.toast('Category added', 'success');
        } catch (e) { Instox.toast(e.message, 'error'); }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        const setSize = parseInt(form.set_size.value || '1', 10) || 1;
        const rawCost = parseFloat(form.cost_price.value);
        const body = {
          name: form.name.value.trim(),
          cost_price: setSize > 1 ? rawCost / setSize : rawCost,
          quantity: parseInt(form.quantity.value || '0', 10),
          category_id: form.category_id.value || null,
          sku: form.sku.value.trim(),
          description: form.description.value.trim(),
        };
        if (form.retail_price.value) body.retail_price = parseFloat(form.retail_price.value);

        try {
          let saved;
          if (editingId) {
            const res = await Instox.api('/products/' + editingId, { method: 'PUT', body });
            saved = res.data;
          } else {
            const res = await Instox.api('/products', { method: 'POST', body });
            saved = res.data;
          }

          if (selectedPhotoFile && saved && saved.id) {
            photoStatus.textContent = 'Uploading photo…';
            try {
              await Instox.uploadPhoto(saved.id, selectedPhotoFile);
            } catch (err) {
              Instox.toast('Saved, but photo upload failed: ' + err.message, 'error');
              submitBtn.disabled = false;
              return;
            }
          }

          Instox.toast(editingId ? 'Saved' : `Added ${saved.unique_id || 'product'}`, 'success');
          location.href = '/products.html';
        } catch (err) {
          submitBtn.disabled = false;
          Instox.showAlert('alert', err.message, 'error');
        }
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product · Instox</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav id="navbar" class="navbar"></nav>
  <div class="container" style="max-width: 560px;">
    <h1 id="page-title">Add product</h1>
    <div class="card">
      <div id="alert"></div>
      <form id="product-form">
        <div class="form-group">
          <label>Product name *</label>
          <input type="text" name="name" class="form-control" required placeholder="e.g. Blue Curtain 6x8" />
        </div>
        <div class="row">
          <div class="col form-group">
            <label>Cost price (₹) *</label>
            <input type="number" step="0.01" min="0" name="cost_price" class="form-control" required />
          </div>
          <div class="col form-group">
            <label>Set size</label>
            <input type="number" step="1" min="1" name="set_size" class="form-control" value="1" />
          </div>
        </div>
        <div class="row">
          <div class="col form-group">
            <label>Profit % (your markup)</label>
            <input type="number" step="0.01" min="0" name="profit_percentage" class="form-control" />
            <div style="font-size:0.75rem;color:var(--muted);margin-top:4px">Leave blank to use your default.</div>
          </div>
          <div class="col form-group">
            <label>Retail price (₹)</label>
            <input type="number" step="0.01" min="0" name="retail_price" class="form-control" />
            <div style="font-size:0.75rem;color:var(--muted);margin-top:4px">Auto-calculated. Override if needed.</div>
          </div>
        </div>
        <div class="row">
          <div class="col form-group">
            <label>Quantity in stock *</label>
            <input type="number" step="1" min="0" name="quantity" class="form-control" required value="0" />
          </div>
          <div class="col form-group">
            <label>Category</label>
            <select name="category_id" id="category-select" class="form-control">
              <option value="">— None —</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>SKU (optional)</label>
          <input type="text" name="sku" class="form-control" />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" class="form-control" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-block" id="submit-btn">Save</button>
        <a href="/products.html" class="btn btn-block btn-secondary" style="margin-top:8px">Cancel</a>
      </form>
    </div>

    <div class="card" style="margin-top:12px">
      <h3 style="margin-top:0">Add new category</h3>
      <div class="row">
        <input type="text" id="new-cat" class="form-control" placeholder="Category name" />
        <button id="add-cat-btn" class="btn btn-sm btn-secondary">Add</button>
      </div>
    </div>
  </div>
  <nav id="bottom-nav" class="bottom-nav"></nav>
  <script src="/static/js/app.js"></script>
  <script>
    (async () => {
      const user = await Instox.bootstrapPage({ active: 'products' });
      if (!user) return;

      const form = document.getElementById('product-form');
      const params = new URLSearchParams(location.search);
      const editingId = params.get('id');
      let editingProduct = null;

      const profitInput = form.profit_percentage;
      profitInput.placeholder = `Default ${user.profit_percentage}%`;

      const catSelect = document.getElementById('category-select');
      async function loadCategories(selectedId) {
        const { data } = await Instox.api('/categories');
        catSelect.innerHTML = '<option value="">— None —</option>' + data.map(c => `<option value="${c.id}" ${selectedId == c.id ? 'selected' : ''}>${Instox.escapeHtml(c.name)}</option>`).join('');
      }
      await loadCategories(null);

      if (editingId) {
        document.getElementById('page-title').textContent = 'Edit product';
        try {
          const { data } = await Instox.api('/products/' + editingId);
          editingProduct = data;
          form.name.value = data.name;
          form.cost_price.value = data.cost_price;
          form.retail_price.value = data.retail_price;
          form.quantity.value = data.quantity;
          form.sku.value = data.sku || '';
          form.description.value = data.description || '';
          if (data.category_id) form.category_id.value = data.category_id;
        } catch (e) {
          Instox.showAlert('alert', e.message, 'error');
        }
      }

      let lastCalcedCost = null;

      async function recalcRetail() {
        const cost = parseFloat(form.cost_price.value);
        const setSize = parseInt(form.set_size.value || '1', 10) || 1;
        if (!cost || cost <= 0) return;
        try {
          const body = { cost_price: cost, set_size: setSize };
          if (form.profit_percentage.value) body.profit_percentage = parseFloat(form.profit_percentage.value);
          const { data } = await Instox.api('/products/calculate-price', { method: 'POST', body });
          form.retail_price.value = data.retail_price;
          lastCalcedCost = cost;
        } catch (e) { /* ignore */ }
      }

      ['cost_price', 'set_size', 'profit_percentage'].forEach((n) => {
        form[n].addEventListener('input', Instox.debounce(recalcRetail, 200));
      });

      document.getElementById('add-cat-btn').addEventListener('click', async () => {
        const name = document.getElementById('new-cat').value.trim();
        if (!name) return;
        try {
          const { data } = await Instox.api('/categories', { method: 'POST', body: { name } });
          document.getElementById('new-cat').value = '';
          await loadCategories(data.id);
          Instox.toast('Category added', 'success');
        } catch (e) { Instox.toast(e.message, 'error'); }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const setSize = parseInt(form.set_size.value || '1', 10) || 1;
        const rawCost = parseFloat(form.cost_price.value);
        const body = {
          name: form.name.value.trim(),
          cost_price: setSize > 1 ? rawCost / setSize : rawCost,
          quantity: parseInt(form.quantity.value || '0', 10),
          category_id: form.category_id.value || null,
          sku: form.sku.value.trim(),
          description: form.description.value.trim(),
        };
        if (form.retail_price.value) body.retail_price = parseFloat(form.retail_price.value);

        try {
          if (editingId) {
            await Instox.api('/products/' + editingId, { method: 'PUT', body });
            Instox.toast('Saved', 'success');
          } else {
            await Instox.api('/products', { method: 'POST', body });
            Instox.toast('Product added', 'success');
          }
          location.href = '/products.html';
        } catch (err) {
          Instox.showAlert('alert', err.message, 'error');
        }
      });
    })();
  </script>
</body>
</html>

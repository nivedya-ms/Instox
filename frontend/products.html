<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products · Instox</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav id="navbar" class="navbar"></nav>
  <div class="container">

      <h1 style="margin:8px 0">Products</h1>
      <a href="/product_form.html" class="btn btn-sm">+ Add</a>
    </div>

    <div class="search-bar">
      <input type="text" id="search" class="form-control" placeholder="Search by name or SKU..." />

    </div>
  </div>
  <nav id="bottom-nav" class="bottom-nav"></nav>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/products.js"></script>
